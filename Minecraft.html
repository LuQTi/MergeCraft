<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Minecraft Merge</title>
<style>
    body {
        margin: 0;
        padding: 0;
        overflow: hidden; 
        background: url("Bilder/MC Hintergrund.png") center/cover no-repeat fixed;
        user-select: none;
        touch-action: none;
    }

    #game {
        width: 360px;
        margin: 20px auto;
        display: grid;
        grid-template-columns: repeat(3, 120px);
        grid-template-rows: repeat(3, 120px);
        gap: 5px;
    }

    .cell {
        width: 120px;
        height: 120px;
        background: rgba(0,0,0,0.25);
        border: 2px solid #444;
        position: relative;
        border-radius: 10px;
    }

    .block {
        width: 90%;
        height: 90%;
        position: absolute;
        top: 5%;
        left: 5%;
        border-radius: 8px;
        background-size: cover;
        background-position: center;
    }

    #pickaxe {
        width: 100px;
        display: block;
        margin: 30px auto;
        cursor: pointer;
    }
	
	#levelDisplay {
		text-align: center;
		color: #fff;
	}

/* --- MODERNES ENDE-POPUP MIT FADE-IN, BLUR, GLOW --- */

#popup {
    position: fixed;
    top: 0; 
    left: 0;
    width: 100vw;
    height: 100vh;
    backdrop-filter: blur(10px);
    background: rgba(0, 0, 0, 0.45);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999999;

    opacity: 0;
    animation: fadeInOverlay 0.5s ease forwards; /* <--- FADE-IN */
}

/* weicher Overlay-Fade-In */
@keyframes fadeInOverlay {
    from { opacity: 0; }
    to { opacity: 1; }
}

#popupBox {
    background: rgba(25, 25, 25, 0.55);
    padding: 45px 55px;
    border-radius: 28px;
    text-align: center;
    color: white;
    font-family: Arial;
    max-width: 85%;
    box-shadow: 0 0 60px rgba(0,0,0,0.7);
    backdrop-filter: blur(14px);

    transform: scale(0.8);
    opacity: 0;
    animation: fadeInPopup 0.7s cubic-bezier(.14,.83,.39,1.19) forwards 0.2s;
}

/* Popup springt weich rein */
@keyframes fadeInPopup {
    0%   { opacity: 0; transform: scale(0.8); }
    80%  { opacity: 1; transform: scale(1.05); }
    100% { opacity: 1; transform: scale(1); }
}

#popupText {
    font-size: 34px;
    margin-bottom: 30px;
    text-shadow: 0 0 15px rgba(0,0,0,0.9);
    font-weight: bold;
}

/* stylischer Restart-Button */
#restartButton {
    font-size: 26px;
    padding: 15px 40px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    background: linear-gradient(135deg, rgba(76, 175, 80, 0.9), rgba(56, 140, 60, 0.9));
    color: white;
    box-shadow: 0 0 25px rgba(0,0,0,0.5);

    transition: 0.25s ease;
}

#restartButton:hover {
    transform: translateY(-4px);
    box-shadow: 0 0 35px rgba(76, 255, 100, 0.5);
}

#restartButton:active {
    transform: scale(0.96);
}

</style>
</head>
<body>

<img id="pickaxe" src="Bilder/Spitzhacke.png">

<div id="game">
    <div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div>
</div>

<div id="levelDisplay">Enter drücken um Blöcke abzubauen</div>

<!-- NEUES POPUP MIT BUTTON -->
<div id="popup">
    <div id="popupBox">
        <div id="popupText">🎉 Glückwunsch! Du hast das ENDE erreicht! 🎉</div>
        <button id="restartButton">Neu starten</button>
    </div>
</div>

<script>

/* ---------------------------- BLOCK GRAFIKEN ---------------------------- */

const blockTextures = {
    1: "Bilder/Gras.png",
    2: "Bilder/Holz.png",
    3: "Bilder/Brett.png",
    4: "Bilder/Werkbank.png",
    5: "Bilder/Stein.png",
    6: "Bilder/Bruchstein.png",
    7: "Bilder/Kohle.png",
    8: "Bilder/Ofen.png",
    9: "Bilder/Sand.png",
    10:"Bilder/Glas.png",
    11:"Bilder/Eisenerz.png",
    12:"Bilder/Golderz.png",
    13:"Bilder/Redstoneerz.png",
    14:"Bilder/Diamanterz.png",
    15:"Bilder/Smaragderz.png",
    16:"Bilder/Obsidian.png",
    17:"Bilder/Netherziegel.png",
    18:"Bilder/Glowstone.png",
    19:"Bilder/Endstone.png",
    20:"Bilder/Bedrock.png"
};

let countMerge = 0;

/* ---------------------------- LEVEL BERECHNUNG ---------------------------- */
function updateLevelDisplay() {
    const blocks = [...document.querySelectorAll(".block")];
    let maxLvl = 1;
    blocks.forEach(b => maxLvl = Math.max(maxLvl, parseInt(b.dataset.level)));

    const spawnLevel = calculateSpawnLevel();

    document.getElementById("levelDisplay").innerHTML =
        `Höchster Block: <b>${maxLvl}</b> &nbsp;|&nbsp;
         Spawn-Level: <b>${spawnLevel}</b> &nbsp;|&nbsp;
         Merge-Anzahl: <b>${countMerge}</b>`;
}

function getMaxLevel() {
    let max = 1;
    document.querySelectorAll(".block").forEach(b => {
        max = Math.max(max, parseInt(b.dataset.level));
    });
    return max;
}

function calculateSpawnLevel() {
    const max = getMaxLevel();

    if (max < 9) return 1;
    return max - 7;
}

/* ---------------------------- BLOCK SPAWN ---------------------------- */
function removeBlocksBelowSpawnLevel() {
    const spawnLevel = calculateSpawnLevel();
    const blocks = [...document.querySelectorAll(".block")];

    blocks.forEach(block => {
        const lvl = parseInt(block.dataset.level);
        if (lvl < spawnLevel) {
            block.remove();
        }
    });
}

function spawnBlock(level = null) {
    const cells = [...document.querySelectorAll(".cell")];
    const empty = cells.filter(c => c.children.length === 0);
    if (empty.length === 0) return;

    const cell = empty[Math.floor(Math.random() * empty.length)];

    const block = document.createElement("div");
    const spawnLevel = level || calculateSpawnLevel();

    block.className = "block";
    block.dataset.level = spawnLevel;
    block.style.backgroundImage = `url(${blockTextures[spawnLevel]})`;

    cell.appendChild(block);

    enableDrag(block);
	removeBlocksBelowSpawnLevel();
	updateLevelDisplay();
}

/* ---------------------------- MERGE ---------------------------- */

function mergeBlocks(cell, level) {

    cell.innerHTML = "";

    const newLevel = level + 1;

    const newBlock = document.createElement("div");
    newBlock.className = "block";
    newBlock.dataset.level = newLevel;
    newBlock.style.backgroundImage = `url(${blockTextures[newLevel]})`;

    cell.appendChild(newBlock);
    enableDrag(newBlock);

    if (newLevel >= 20) {
        showPopup();
    }
}

/* ---------------------------- POPUP FUNKTION ---------------------------- */

function showPopup() {
    const popup = document.getElementById("popup");
    popup.style.display = "flex";

    // Alles blockieren außer Popup
    document.body.style.pointerEvents = "none";
    popup.style.pointerEvents = "auto";
}

/* ---------------------------- NEUSTART ---------------------------- */

document.getElementById("restartButton").onclick = () => {

    // Popup verstecken
    document.getElementById("popup").style.display = "none";

    // Eingaben wieder aktivieren
    document.body.style.pointerEvents = "auto";

    // Spielfeld leeren
    document.querySelectorAll(".cell").forEach(c => c.innerHTML = "");

    // Levelanzeige aktualisieren
    updateLevelDisplay();
};

/* ---------------------------- DRAG & DROP ---------------------------- */

let dragClone = null;
let originalBlock = null;
let originalCell = null;

function enableDrag(block) {

    block.onpointerdown = e => {
        e.preventDefault();

        originalBlock = block;
        originalCell = block.parentElement;

        dragClone = block.cloneNode(true);
        dragClone.style.position = "fixed";
        dragClone.style.pointerEvents = "none";
        dragClone.style.width = "90px";
        dragClone.style.height = "90px";
        dragClone.style.zIndex = 999999;

        document.body.appendChild(dragClone);

        moveClone(e);

        window.onpointermove = ev => moveClone(ev);

        window.onpointerup = ev => {
            finishDrag(ev);
            window.onpointermove = null;
            window.onpointerup = null;
        };
    };
}

function moveClone(e) {
    if (!dragClone) return;
    dragClone.style.left = (e.clientX - 45) + "px";
    dragClone.style.top = (e.clientY - 45) + "px";
}

function finishDrag(e) {
    if (!dragClone) return;

    const dropTarget = document.elementFromPoint(e.clientX, e.clientY);
    const targetCell = dropTarget?.closest(".cell");

    const originalLevel = parseInt(originalBlock.dataset.level);

    if (targetCell && targetCell !== originalCell) {

        if (targetCell.children.length === 0) {
            targetCell.appendChild(originalBlock);
        }
        else {
            const other = targetCell.children[0];
            const otherLevel = parseInt(other.dataset.level);

            if (otherLevel === originalLevel) {
                mergeBlocks(targetCell, originalLevel);
                originalBlock.remove();
				countMerge ++;
            }
        }
    }

    dragClone.remove();
    dragClone = null;
	
	updateLevelDisplay();
}

/* ---------------------------- PICKAXE + ENTER ---------------------------- */

document.getElementById("pickaxe").onclick = () => spawnBlock();
document.onkeydown = e => { if (e.key === "Enter") spawnBlock(); };

document.addEventListener("keydown", e => {
    const popup = document.getElementById("popup");

    // Wenn Popup sichtbar ist → ENTER = Neustart
    if (popup.style.display === "flex" && e.key === "Enter") {
        document.getElementById("restartButton").click();
    }
});

</script>
</body>
</html>
