<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Minecraft Merge</title>
<style>

/* ============================ BASIS ============================ */

body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: url("Bilder/MC Hintergrund.png") center/cover no-repeat fixed;
    user-select: none;
    touch-action: none;
    font-family: Arial, sans-serif;
}

/* ============================ GEAMTES LAYOUT ============================ */

#game {
    width: 360px;
    margin: 20px auto 10px auto;
    display: grid;
    grid-template-columns: repeat(3, 120px);
    grid-template-rows: repeat(3, 120px);
    gap: 5px;
	justify-content: center;
}

.cell {
    width: 120px;
    height: 120px;
    background: rgba(0,0,0,0.25);
    border: 2px solid #444;
    position: relative;
    border-radius: 14px;
}

.block {
    width: 90%;
    height: 90%;
    position: absolute;
    top: 5%;
    left: 5%;
    border-radius: 10px;
    background-size: cover;
    background-position: center;
}

/* ============================ SPITZHACKE ============================ */

#pickaxeWrapper {
    width: 120px;
    height: 120px;
    margin: 20px auto;
    background: rgba(0, 0, 0, 0.45);
    border-radius: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    border: 3px solid rgba(255,255,255,0.15);
    box-shadow: 0 0 25px rgba(0,0,0,0.7);
}

#pickaxe {
    width: 90px;
    cursor: pointer;
    transition: transform 0.2s ease;
}

#pickaxe:hover {
    transform: scale(1.1);
}

/* ============================ LEVEL ANZEIGE ============================ */

#levelDisplay {
    text-align: center;
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 0 0 10px black;
    margin-top: 20px;
    line-height: 1.6;
}

/* ============================ POPUP ============================ */

#popup {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    backdrop-filter: blur(10px);
    background: rgba(0, 0, 0, 0.45);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999999;
    opacity: 0;
    animation: fadeInOverlay 0.5s ease forwards;
}

@keyframes fadeInOverlay {
    from { opacity: 0; }
    to { opacity: 1; }
}

#popupBox {
    background: rgba(25, 25, 25, 0.55);
    padding: 45px 55px;
    border-radius: 28px;
    text-align: center;
    color: white;
    max-width: 85%;
    box-shadow: 0 0 60px rgba(0,0,0,0.7);
    backdrop-filter: blur(14px);
    transform: scale(0.8);
    opacity: 0;
    animation: fadeInPopup 0.7s cubic-bezier(.14,.83,.39,1.19) forwards 0.2s;
}

@keyframes fadeInPopup {
    0%   { opacity: 0; transform: scale(0.8); }
    80%  { opacity: 1; transform: scale(1.05); }
    100% { opacity: 1; transform: scale(1); }
}

#popupText {
    font-size: 34px;
    margin-bottom: 30px;
    text-shadow: 0 0 15px rgba(0,0,0,0.9);
    font-weight: bold;
}

#restartButton {
    font-size: 26px;
    padding: 15px 40px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    background: linear-gradient(135deg, rgba(76,175,80,.9), rgba(56,140,60,.9));
    color: white;
    box-shadow: 0 0 25px rgba(0,0,0,0.5);
    transition: 0.25s ease;
}

#restartButton:hover {
    transform: translateY(-4px);
    box-shadow: 0 0 35px rgba(76,255,100,0.5);
}

#restartButton:active {
    transform: scale(0.96);
}

/* ============================ RESET BUTTON ============================ */

#resetGame {
    position: absolute;
    top: 60px;
    right: calc(50% - 260px);
    padding: 12px 22px;
    font-size: 16px;
    font-weight: bold;
    color: white;
    background: linear-gradient(135deg, #8b0000, #b22222);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
    transition: 0.25s ease;
    z-index: 1000;
}

#resetGame:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 25px rgba(255,50,50,0.6);
}

/* ==================== RESET CONFIRM POPUP ==================== */

#confirmReset {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(10px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999999;
}

.confirmBox {
    background: rgba(25,25,25,0.65);
    padding: 35px 45px;
    border-radius: 22px;
    text-align: center;
    box-shadow: 0 0 50px rgba(0,0,0,0.8);
    animation: popIn 0.35s ease;
}

@keyframes popIn {
    from { transform: scale(0.85); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
}

.confirmText {
    font-size: 26px;
    font-weight: bold;
    color: white;
    margin-bottom: 25px;
    text-shadow: 0 0 12px black;
}

.confirmButtons {
    display: flex;
    gap: 20px;
    justify-content: center;
}

#confirmYes {
    background: linear-gradient(135deg, #b22222, #8b0000);
}

#confirmNo {
    background: linear-gradient(135deg, #4CAF50, #2e7d32);
}

.confirmButtons button {
    border: none;
    padding: 14px 32px;
    font-size: 20px;
    color: white;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
    transition: 0.2s ease;
}

.confirmButtons button:hover {
    transform: translateY(-3px);
}

/* ============================ MOBILE VERSION ============================ */

@media (max-width: 600px) {

    #game {
		padding-top: 80px;
        width: 300px;
        grid-template-columns: repeat(3, 95px);
        grid-template-rows: repeat(3, 95px);
        gap: 6px;
        margin: 10px auto;
    }

    .cell {
        width: 95px;
        height: 95px;
    }

    .block {
        width: 88%;
        height: 88%;
    }

    #pickaxeWrapper {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        width: 100px;
        height: 100px;
        z-index: 999;
    }

    #pickaxe {
        width: 75px;
    }

    #levelDisplay {
		margin-top: 20px;
        font-size: 15px;
        padding: 10px;
    }

    #popupBox {
        padding: 30px 25px;
    }

    #popupText {
        font-size: 26px;
    }

    #restartButton {
        font-size: 22px;
        padding: 12px 30px;
    }
	
    #resetGame {
        top: 20px;
        left: calc(50% - 150px);
        right: auto;
        font-size: 14px;
        padding: 10px 18px;
    }
}

</style>
</head>
<body>

<button id="resetGame">⟲ Neu starten</button>

<div id="pickaxeWrapper">
    <img id="pickaxe" src="Bilder/Spitzhacke.png">
</div>

<div id="game">
    <div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div>
</div>

<div id="levelDisplay">Enter drücken um Blöcke abzubauen</div>

<!-- NEUES POPUP MIT BUTTON -->
<div id="popup">
    <div id="popupBox">
        <div id="popupText">🎉 Glückwunsch! Du hast das ENDE erreicht! 🎉</div>
        <button id="restartButton">Neu starten</button>
    </div>
</div>
	
<div id="confirmReset">
    <div class="confirmBox">
        <div class="confirmText">⚠️ Wirklich neu starten?</div>
        <div class="confirmButtons">
            <button id="confirmYes">Ja</button>
            <button id="confirmNo">Nein</button>
        </div>
    </div>
</div>

<script>

function saveGame() {
    const save = {
        cells: [],
        countMerge
    };

    document.querySelectorAll(".cell").forEach(cell => {
        if (cell.children.length) {
            save.cells.push(cell.children[0].dataset.level);
        } else {
            save.cells.push(null);
        }
    });

    localStorage.setItem("minecraftMergeSave", JSON.stringify(save));
}

/* ---------------------------- BLOCK GRAFIKEN ---------------------------- */

const blockTextures = {
    1: "Bilder/Gras.png",
    2: "Bilder/Holz.png",
    3: "Bilder/Brett.png",
    4: "Bilder/Werkbank.png",
    5: "Bilder/Stein.png",
    6: "Bilder/Bruchstein.png",
    7: "Bilder/Kohle.png",
    8: "Bilder/Ofen.png",
    9: "Bilder/Sand.png",
    10:"Bilder/Glas.png",
    11:"Bilder/Eisenerz.png",
    12:"Bilder/Golderz.png",
    13:"Bilder/Redstoneerz.png",
    14:"Bilder/Diamanterz.png",
    15:"Bilder/Smaragderz.png",
    16:"Bilder/Obsidian.png",
    17:"Bilder/Netherziegel.png",
    18:"Bilder/Glowstone.png",
    19:"Bilder/Endstone.png",
    20:"Bilder/Bedrock.png"
};

function loadGame() {
    const data = localStorage.getItem("minecraftMergeSave");
    if (!data) return;

    const save = JSON.parse(data);
    const cells = document.querySelectorAll(".cell");

    countMerge = save.countMerge || 0;

    save.cells.forEach((lvl, i) => {
        if (lvl !== null) {
            const block = document.createElement("div");
            block.className = "block";
            block.dataset.level = lvl;
            block.style.backgroundImage = `url(${blockTextures[lvl]})`;
            cells[i].appendChild(block);
            enableDrag(block);
        }
    });

    updateLevelDisplay();
}

let countMerge = 0;

/* ---------------------------- LEVEL BERECHNUNG ---------------------------- */
function updateLevelDisplay() {
    const blocks = [...document.querySelectorAll(".block")];
    let maxLvl = 1;
    blocks.forEach(b => maxLvl = Math.max(maxLvl, parseInt(b.dataset.level)));

    const spawnLevel = calculateSpawnLevel();

    document.getElementById("levelDisplay").innerHTML =
    `Höchster Block: <b>${maxLvl}</b><br>
     Spawn-Level: <b>${spawnLevel}</b> |
     Merges: <b>${countMerge}</b>`;
}

function getMaxLevel() {
    let max = 1;
    document.querySelectorAll(".block").forEach(b => {
        max = Math.max(max, parseInt(b.dataset.level));
    });
    return max;
}

function calculateSpawnLevel() {
    const max = getMaxLevel();

    if (max < 9) return 1;
    return max - 7;
}

/* ---------------------------- BLOCK SPAWN ---------------------------- */
function removeBlocksBelowSpawnLevel() {
    const spawnLevel = calculateSpawnLevel();
    const blocks = [...document.querySelectorAll(".block")];

    blocks.forEach(block => {
        const lvl = parseInt(block.dataset.level);
        if (lvl < spawnLevel) {
            block.remove();
        }
    });
}

function spawnBlock(level = null) {
    const cells = [...document.querySelectorAll(".cell")];
    const empty = cells.filter(c => c.children.length === 0);
    if (empty.length === 0) return;

    const cell = empty[Math.floor(Math.random() * empty.length)];

    const block = document.createElement("div");
    const spawnLevel = level || calculateSpawnLevel();

    block.className = "block";
    block.dataset.level = spawnLevel;
    block.style.backgroundImage = `url(${blockTextures[spawnLevel]})`;

    cell.appendChild(block);

    enableDrag(block);
	removeBlocksBelowSpawnLevel();
	updateLevelDisplay();
	saveGame();
}

/* ---------------------------- MERGE ---------------------------- */

function mergeBlocks(cell, level) {

    cell.innerHTML = "";

    const newLevel = level + 1;

    const newBlock = document.createElement("div");
    newBlock.className = "block";
    newBlock.dataset.level = newLevel;
    newBlock.style.backgroundImage = `url(${blockTextures[newLevel]})`;

    cell.appendChild(newBlock);
    enableDrag(newBlock);
	
	countMerge++;
	saveGame();

    if (newLevel >= 20) {
        showPopup();
    }
}

/* ---------------------------- POPUP FUNKTION ---------------------------- */

function showPopup() {
    const popup = document.getElementById("popup");
    popup.style.display = "flex";

    // Alles blockieren außer Popup
    document.body.style.pointerEvents = "none";
    popup.style.pointerEvents = "auto";
}

/* ---------------------------- NEUSTART ---------------------------- */

document.getElementById("restartButton").onclick = () => {
    localStorage.removeItem("minecraftMergeSave");
    window.location.href = "index.html";
};

/* ---------------------------- DRAG & DROP ---------------------------- */

let dragClone = null;
let originalBlock = null;
let originalCell = null;

function enableDrag(block) {

    block.onpointerdown = e => {
        e.preventDefault();

        originalBlock = block;
        originalCell = block.parentElement;

        dragClone = block.cloneNode(true);
        dragClone.style.position = "fixed";
        dragClone.style.pointerEvents = "none";
        dragClone.style.width = "90px";
        dragClone.style.height = "90px";
        dragClone.style.zIndex = 999999;

        document.body.appendChild(dragClone);

        moveClone(e);

        window.onpointermove = ev => moveClone(ev);

        window.onpointerup = ev => {
            finishDrag(ev);
            window.onpointermove = null;
            window.onpointerup = null;
        };
    };
}

function moveClone(e) {
    if (!dragClone) return;
    dragClone.style.left = (e.clientX - 45) + "px";
    dragClone.style.top = (e.clientY - 45) + "px";
}

function finishDrag(e) {
    if (!dragClone) return;

    const dropTarget = document.elementFromPoint(e.clientX, e.clientY);
    const targetCell = dropTarget?.closest(".cell");

    const originalLevel = parseInt(originalBlock.dataset.level);

    if (targetCell && targetCell !== originalCell) {

        if (targetCell.children.length === 0) {
            targetCell.appendChild(originalBlock);
        }
        else {
            const other = targetCell.children[0];
            const otherLevel = parseInt(other.dataset.level);

            if (otherLevel === originalLevel) {
                mergeBlocks(targetCell, originalLevel);
                originalBlock.remove();
            }
        }
    }

    dragClone.remove();
    dragClone = null;
	
	updateLevelDisplay();
	saveGame();
}

/* ---------------------------- PICKAXE + ENTER ---------------------------- */

document.getElementById("pickaxe").onclick = () => spawnBlock();
document.onkeydown = e => { if (e.key === "Enter") spawnBlock(); };

document.addEventListener("keydown", e => {
    const popup = document.getElementById("popup");

    // Wenn Popup sichtbar ist → ENTER = Neustart
    if (popup.style.display === "flex" && e.key === "Enter") {
        document.getElementById("restartButton").click();
    }
});

const confirmReset = document.getElementById("confirmReset");

document.getElementById("resetGame").onclick = () => {
    confirmReset.style.display = "flex";
    document.body.style.pointerEvents = "none";
    confirmReset.style.pointerEvents = "auto";
};

document.getElementById("confirmYes").onclick = () => {
    localStorage.removeItem("minecraftMergeSave");
    window.location.href = "index.html";
};

document.getElementById("confirmNo").onclick = () => {
    confirmReset.style.display = "none";
    document.body.style.pointerEvents = "auto";
};

loadGame();

</script>
</body>
</html>
